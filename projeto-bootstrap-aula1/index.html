<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Demo Bootstrap</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <script src="./css/style.css"></script>
</head>

<body>

    <div class="container text-center">
        <div class="row">
            <div class="col">
                Quem já experimentou
            </div>
        </div>

        <div class="container text-center">
            <div class="row align-items-center">
                <div class="col">
                    O que dizem nossos clientes
                </div>
            </div>

            <div id="carouselExample" class="carousel slide">
                <div class="carousel-inner">

                    <div class="carousel-item active">
                        ⭐⭐⭐⭐
                        <img src="./img/assinante1.png" class="d-block w-100 imagem-carousel" alt="Walter">
                    </div>

                    <div class="carousel-item">
                        ⭐⭐⭐⭐⭐
                        <img src="./img/assinante2.png" class="d-block w-100 imagem-carousel" alt="Jesse">
                    </div>

                    <div class="carousel-item">
                        ⭐⭐⭐⭐⭐
                        <img src="./img/assinante3.png" class="d-block w-100 imagem-carousel" alt="Gus">
                    </div>

                </div>

                <button class="carousel-control-prev" type="button" data-bs-target="#carouselExample"
                    data-bs-slide="prev">
                    <span class="carousel-control-prev-icon" aria-hidden="true"></span>
                    <span class="visually-hidden">Anterior</span>
                </button>

                <button class="carousel-control-next" type="button" data-bs-target="#carouselExample"
                    data-bs-slide="next">
                    <span class="carousel-control-next-icon" aria-hidden="true"></span>
                    <span class="visually-hidden">Próximo</span>
                </button>
            </div>


            <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
                integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
                crossorigin="anonymous"></script>

</body>

</html>
